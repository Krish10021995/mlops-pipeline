data:
  n_rows: 50000
  seed: 42
  source: synthetic
  raw_path: data/raw/trips.parquet

features:
  output_path: data/features/features.parquet

model:
  name: taxi-fare-model
  artifact_path: artifacts/taxi-fare-model.joblib
  type: HistGradientBoostingRegressor
  params:
    max_iter: 400
    learning_rate: 0.06
    max_depth: null
    random_state: 42
  registry_alias: champion

tracking:
  experiment_name: taxi-fare

serving:
  host: 0.0.0.0
  port: 8000

drift:
  reference_path: data/features/features.parquet
  live_path: data/predictions/live.csv
  threshold: 0.2