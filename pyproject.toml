[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlops-pipeline"
version = "0.1.0"
description = "End-to-end ML model lifecycle: data, features, training, model registry, serving, monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishnendu Pramanik" }]
keywords = ["mlops", "mlflow", "fastapi", "scikit-learn", "dvc"]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "mlflow>=2.16",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "prometheus-client>=0.20",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "httpx>=0.27",
  "dvc>=3.55",
  "docker>=7.1",
]

[project.scripts]
mlops-data = "mlops.data.generate:main"
mlops-features = "mlops.features.build:main"
mlops-train = "mlops.models.train:main"
mlops-evaluate = "mlops.models.evaluate:main"
mlops-predict = "mlops.models.predict:main"
mlops-drift = "mlops.serving.drift:main"
mlops-serve = "mlops.serving.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]